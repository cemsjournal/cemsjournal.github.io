<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 848" fill="none">
  <defs>
    <linearGradient id="coverBg" x1="0" y1="0" x2="600" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A2342"/>
      <stop offset="55%" stop-color="#103763"/>
      <stop offset="100%" stop-color="#071930"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B88A1E"/>
      <stop offset="50%" stop-color="#F0CE6E"/>
      <stop offset="100%" stop-color="#B88A1E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="600" height="848" fill="url(#coverBg)"/>
  <rect width="600" height="848" fill="url(#grid)"/>

  <!-- Decorative geometric circles -->
  <circle cx="510" cy="140" r="190" stroke="#E5BE53" stroke-width="1" stroke-opacity="0.14"/>
  <circle cx="510" cy="140" r="140" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.14"/>
  <circle cx="90" cy="700" r="220" stroke="#E5BE53" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Outer Frame -->
  <rect x="26" y="26" width="548" height="796" rx="8" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8"/>
  <rect x="34" y="34" width="532" height="780" rx="4" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Top Header Band -->
  <rect x="34" y="34" width="532" height="70" fill="#071930" fill-opacity="0.7"/>
  <text x="54" y="75" fill="#E5BE53" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="1.5">JoES · PEER-REVIEWED</text>
  <text x="546" y="75" text-anchor="end" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">ISSN · OPEN ACCESS</text>
  <line x1="34" y1="104" x2="566" y2="104" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Emblem -->
  <g transform="translate(250, 145)">
    <circle cx="50" cy="50" r="46" fill="#0B2A4A" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <path d="M26 42C26 39.8 27.8 38 30 38H47C48.7 38 50 39.3 50 41V69C50 67.3 48.7 66 47 66H30C27.8 66 26 64.2 26 62V42Z" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M74 42C74 39.8 72.2 38 70 38H53C51.3 38 50 39.3 50 41V69C50 67.3 51.3 66 53 66H70C72.2 66 74 64.2 74 62V42Z" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="50" cy="27" r="6" fill="#E5BE53"/>
    <path d="M50 24V30M47 27H53" stroke="#0B2A4A" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="300" y="295" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="30" font-weight="bold" letter-spacing="1">JOURNAL OF ENGINEERING</text>
  <text x="300" y="335" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="30" font-weight="bold" letter-spacing="1">&amp; MEDICAL SCIENCES</text>

  <text x="300" y="382" text-anchor="middle" fill="#E5BE53" font-family="Arial, sans-serif" font-size="22" font-weight="bold">مجلة العلوم الهندسية والطبية</text>

  <line x1="160" y1="412" x2="440" y2="412" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="300" y="442" text-anchor="middle" fill="#CBD5E1" font-family="Georgia, serif" font-size="14" font-style="italic">Academy of Engineering Sciences Journal</text>

  <!-- Volume / Date / Edition Band -->
  <rect x="64" y="495" width="472" height="84" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="145" y="530" text-anchor="middle" fill="#E5BE53" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">VOLUME</text>
  <text x="145" y="558" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" font-weight="bold">1</text>

  <line x1="225" y1="512" x2="225" y2="562" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <text x="300" y="530" text-anchor="middle" fill="#E5BE53" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">PUBLICATION</text>
  <text x="300" y="558" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="20" font-weight="bold">JUNE 2018</text>

  <line x1="375" y1="512" x2="375" y2="562" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <text x="455" y="530" text-anchor="middle" fill="#E5BE53" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">EDITION</text>
  <text x="455" y="558" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" font-weight="bold">1</text>

  <!-- Scope Pills -->
  <rect x="115" y="625" width="170" height="34" rx="17" fill="#1E4E79" stroke="#93C5FD" stroke-opacity="0.4"/>
  <text x="200" y="647" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Engineering Sciences</text>

  <rect x="315" y="625" width="170" height="34" rx="17" fill="#1E4E79" stroke="#93C5FD" stroke-opacity="0.4"/>
  <text x="400" y="647" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Medical &amp; Applied Math</text>

  <!-- Footer Band -->
  <line x1="34" y1="744" x2="566" y2="744" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <rect x="34" y="745" width="532" height="69" fill="#071930" fill-opacity="0.8"/>
  <text x="64" y="785" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="13">Website: www.aes.edu.sd</text>
  <text x="536" y="785" text-anchor="end" fill="#E5BE53" font-family="Arial, sans-serif" font-size="13">Email: info@aes.edu.sd</text>
</svg>
